<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlindTester #NONE</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #111;  color: white; text-align: center;}
    input { color: white; width: 80%; height: 4rem; max-width: 300px; text-align: center; display: block; margin-left: auto; margin-right: auto; background-color: #282828; border-color: #9850bf; border-radius: 5px; border-width: 5px; border-style: solid; margin-top: 10px; margin-bottom: 10px; font-size: x-large;}
    button { width: 70%; height: 3rem; max-width: 250px; color: white; text-align: center; display: block; margin-left: auto; margin-right: auto; background-color: #9850bf; border-color: #9850bf; border-radius: 5px; border-width: 5px; border-style: solid; margin-top: 10px; margin-bottom: 10px; font-size: x-large; }
    h1 { margin-top: 0px; margin-bottom: 0px;}
    h5 { margin-top: 0px; margin-bottom: 11rem;}
    #log { border: 1px solid #ccc; height: 200px; overflow-y: scroll; padding: 10px; }
    .hidden { display: none; }
    .leaderboard-list { list-style: none; padding: 0; margin: 0; font-family: monospace; font-size: larger;}
    .leaderboard-list li { padding: 6px 0; }
    .leaderboard-list li.correct { color: #00ff00; font-weight: bold; }
    @keyframes wrongCodeAnimation {
      0%    {border-color: #9850bf;}
      50%   {border-color: red;}
      100%  {border-color: #9850bf;}
    }
  </style>
</head>
<body>
  <h1>BlindTester</h1>
  <h5>Made with <span style="color: red;"><3</span> by GeoffreyGx</h5>

  <div id="join">
    <input id="gameCode" placeholder="Game code" />
    <p id="join_message_box">‎</p>
    <button onclick="joinGameWithButton()">Join</button>
  </div>

  <div id="username_creation" class="hidden">
    <input id="userName" placeholder="Username" />
    <p id="username_message_box">‎</p>
    <button onclick="setUsername()">Join</button>
  </div>

  <div id="answer_box" class="hidden">
    <h3>Answer</h3>
    <input id="answer" placeholder="Answer"/>
    <button id="answer_button" onclick="sendAnswer()">Guess!</button>
    <span id="answer_output"></span>
  </div>

  <div id="waiting_box" class="hidden">
    <h3>Hang tight... The answer is seconds away.</h3>
  </div>

  <div id="leaderboard_box" class="hidden">
    <h3>Leaderboard</h3>
    <ul id="leaderboard" class="leaderboard-list"></ul>    
  </div>
  <!--
  <h3>Log</h3>
  <div id="log"></div>
  -->
  <script>
    let ws = null;
    let userId = null;
    let gameCode = null;

    const host = window.location.host
    const origin = window.location.origin;
    const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';

    // Extract game code and optional user id from URL (e.g., /join/abc123 or /join/abc123/uid)
    function extractGameCodeFromUrl() {
      const pathSegments = window.location.pathname.split('/').filter(s => s);
      if (pathSegments.length >= 2 && pathSegments[0] === 'join') {
        return { gameCode: pathSegments[1], userId: pathSegments[2] || null };
      }
      return { gameCode: null, userId: null};
    }

    // Pre-fill game code if provided in URL. Validate the party and player before auto-joining.
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const info = extractGameCodeFromUrl();

        gameCode = info.gameCode || null;
        userId = info.userId || null;

        if (gameCode) {
          document.getElementById('gameCode').value = gameCode.toLowerCase();

          // Check that the party exists before proceeding
          const partyExists = await checkPartyExistence();
          if (!partyExists) {
            userId = null;
            const cleanUrl = `${origin}/join`;
            window.history.replaceState({ gameCode }, '', cleanUrl);
            return;
          } else {
            if (userId) {
              const playerExists = await checkPlayerExistence(userId);
              if (!playerExists) {
                userId = null;
                const cleanUrl = `${origin}/join/${encodeURIComponent(gameCode)}`;
                window.history.replaceState({ gameCode }, '', cleanUrl);
                // show username creation so user can re-join
                document.getElementById('username_creation').classList.remove('hidden');
                try {
                  joinGame();
                } catch (err) {
                  console.log(`Connection failed : ${err}`)
                }
                return;
              } else {
                usernameExistence = await checkUsernameExistence()
                if (usernameExistence) {
                  document.getElementById('username_creation').classList.add('hidden');
                  document.getElementById('answer_box').classList.remove('hidden');
                } else {
                  document.getElementById('username_creation').classList.remove('hidden');
                  document.getElementById('answer_box').classList.add('hidden');
                }
                try {
                  joinGame();
                } catch (err) {
                  console.log(`Connection failed : ${err}`)
                }
                return;
              }
            } else {
              try {
                  joinGame();
                } catch (err) {
                  console.log(`Connection failed : ${err}`)
                }
              return;
            };
          }
        }
      } catch (err) {
        console.log('Error during URL prefill: ' + err);
      }
    });

    function log(msg) {
      const logBox = document.getElementById('log');
      if (logBox) {
        logBox.innerHTML += msg + "\n";
        logBox.scrollTop = logBox.scrollHeight;
      }
    }

    async function checkUsernameExistence() {
      try {
        const res = await fetch(`${origin}/ping_username/${gameCode}/${userId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        })

        if (!res.ok) {
          console.log("Can't check for party existence. Report this to the developer.");
          return;
        }

        const data = await res.json()

        if (data.action === 'username_not_known') {
          console.log(`Username does not appear to have been set for user id : ${gameCode}`)
          return false;
        } else if (data.action === 'username_known') {
          console.log(`Username found`)
          return true;
        } else {
          console.log(`Unknown error...`)
          return;
        }
      } catch (err) {
        console.log(`Error checking for username existence : ${err}`)
      }
    }

    async function checkPartyExistence() {
      gameCode = document.getElementById('gameCode').value.toLowerCase();
      console.log(gameCode)
      try {
        const res = await fetch(`${origin}/ping/${gameCode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        })

        if (!res.ok) {
          console.log("Can't check for party existence. Report this to the developer.");
          return;
        }

        const data = await res.json();

        if (data.action === 'party_not_found') {
          console.log(`Party with code ${gameCode} couldn't be found.`);
          gameCodeMessageBox = document.getElementById("join_message_box")
          gameCodeMessageBox.style.color = '#ff3d3d'
          gameCodeMessageBox.innerHTML = "This party couldn't be found!"

          gameCodeInput = document.getElementById("gameCode");
          gameCodeInput.style.animationName = "wrongCodeAnimation";
          gameCodeInput.style.animationDuration = "2s";
          return false;
        } else if (data.action === 'party_found') {
          console.log(`Party with code ${gameCode} has been found!`);
          document.getElementById('join').classList.add("hidden")
          document.getElementById('username_creation').classList.remove("hidden");
          return gameCode;
        } else {
          console.log(`Unknown error...`)
          return;
        }
      } catch (err) {
        console.log(`Error finding game : ${err}`)
      }
    }

    async function checkPlayerExistence(player_id) {
      gameCode = document.getElementById('gameCode').value.toLowerCase();
      try {
        const res = await fetch(`${origin}/ping_player/${gameCode}/${player_id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        })

        if (!res.ok) {
          console.log("Can't check for player existence. Report this to the developer.");
          return;
        }

        const data = await res.json();

        if (data.action === 'player_not_found') {
          console.log(`Player with id ${userId} couldn't be found.`);
          return;
        } else if (data.action === 'player_found') {
          console.log(`Player with id ${userId} has been found!`);
          document.getElementById('username_creation').classList.add('hidden');
          return true;
        } else {
          console.log(`Unknown error...`)
          return;
        }
      } catch (err) {
        console.log(`Error finding game : ${err}`)
      }
    }

    async function joinGame() {
        try {
          if (!userId) {
            const res = await fetch(`${origin}/join_game?game_code=${encodeURIComponent(gameCode)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' }
            })
            const data = await res.json();
            console.log("You've been successfully added to the party");
            if (!res.ok) {
            console.log("Can't join party right now...")
            }
            userId = data.player_id;
          };
        
          document.title = `BlindTester #${gameCode}`
          const newUrl = `${origin}/join/${gameCode}/${userId}`;
          window.history.replaceState({ gameCode, userId }, '', newUrl);
          const wsUrl = `${wsProto}//${host}/ws/${gameCode}/${userId}`;
          startWS(wsUrl);
          document.getElementById('join').classList.add('hidden')
          } catch (err) {
          console.log('Error joining: ' + err);
        }
    }

    async function joinGameWithButton() {
      gameCodeExistance = await checkPartyExistence()
      if (gameCodeExistance) {
        joinGame()
      }
    } 


    function startWS(url) {
      ws = new WebSocket(url);

      ws.onopen = () => { 
        log('Connected to server ✔'); 
        // Updating the game so that informations about it are collected if game was already started
        try {ws.send(JSON.stringify({type: "update"}));} catch (err) {console.log(`Error: ${err}`)}
      };
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        console.log(msg);

        if (msg.action === 'username_ok') {
          document.getElementById('username_creation').classList.add('hidden');
          document.getElementById('answer_box').classList.remove('hidden');
        }

        if (msg.action === 'username_failed') {
          document.getElementById('username_message_box').style.color = '#ff3d3d'        
          document.getElementById('username_message_box').innerHTML = "Can't set username..."
        }

        if (msg.action === 'username_empty_or_errored') {
          document.getElementById('username_message_box').style.color = '#ff3d3d'        
          document.getElementById('username_message_box').innerHTML = "Username can't be empty"
        }

        if (msg.action === 'next_song_client') {
          document.getElementById("leaderboard_box").classList.add('hidden');
          document.getElementById("answer_button").disabled = false;
          document.getElementById("answer_box").classList.remove('hidden');
        }

        if (msg.action === 'countdown') {
          log('Countdown: ' + msg.status);
        }

        if (msg.action === "time_limit_exceeded") {
          if (msg.youtube_url) {
            document.getElementById("answer_button").disabled = true;
            document.getElementById("answer_box").classList.add('hidden');
            document.getElementById("answer").value = '';
            document.getElementById("waiting_box").classList.add('hidden');
            document.getElementById("leaderboard_box").classList.remove('hidden');
          } else {
            log("ERROR: No YouTube URL received.");
          }
        }

        if (msg.action === "answering_not_available") {
          answer_output = document.getElementById("answer_output")
          answer_output.style.color = "red"
          answer_output.innerHTML = "You can't answer right now"
        }

        if (msg.action == "awaiting_next") {
          document.getElementById("answer_box").classList.add('hidden');
          document.getElementById("waiting_box").classList.remove('hidden');
        }

        if (msg.leaderboard) {
          // Format leaderboard into a ranked list and render as HTML, highlighting correct players in green
          const entries = Array.isArray(msg.leaderboard) ? msg.leaderboard : Object.entries(msg.leaderboard || {});
          const correctPlayers = msg.correct_players || [];
          
          if (entries.length === 0) {
            document.getElementById('leaderboard').innerHTML = '<li>No scores yet</li>';
          } else {
            // If entries is array of objects, use it; otherwise convert from dict
            let leaderboardData = entries;
            if (entries.length > 0 && Array.isArray(entries[0]) && typeof entries[0][0] === 'string' && typeof entries[0][1] === 'number') {
              // Old format: convert to new format
              leaderboardData = entries.map(([username, score]) => ({
                username: username,
                score: score,
                player_id: null
              }));
            }
            
            // Sort by score descending (should already be sorted from backend, but ensure it)
            leaderboardData.sort((a, b) => b.score - a.score);
            
            const listHtml = leaderboardData.map((entry, idx) => {
              const scoreStr = (entry.score || 0).toFixed(1);
              const isCorrect = entry.player_id && correctPlayers.includes(entry.player_id);
              const className = isCorrect ? 'correct' : '';
              return `<li class="${className}">${idx + 1}. ${entry.username} — ${scoreStr}</li>`;
            }).join('');
            
            document.getElementById('leaderboard').innerHTML = listHtml;
          }
        }

        if (msg.event === 'user_joined') log('User joined: ' + msg.user_id);
      };

      ws.onclose = () => log('Disconnected');
    }

    function setUsername() {
      const username = document.getElementById('userName').value;
      ws.send(JSON.stringify({ type: 'set_username', username: username }));
    }

    function sendAnswer() {
      const ans = document.getElementById('answer').value;
      ws.send(JSON.stringify({ type: 'answer', answer: ans }));
    }
  </script>
</body>
</html>
